name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure and links
        run: python3 scripts/validate.py
      - name: Lint installer
        run: shellcheck install.sh
      - name: Installer smoke test
        run: |
          git checkout -B ci-smoke
          export HOME="$(mktemp -d)" OMNISKILL_REPO="$GITHUB_WORKSPACE" OMNISKILL_BRANCH=ci-smoke
          ./install.sh --claude --antigravity
          test -f "$HOME/.claude/skills/omniskill/SKILL.md"
          test -f "$HOME/.gemini/config/skills/omniskill/SKILL.md"
          ./install.sh --uninstall --claude --antigravity
          test ! -e "$HOME/.claude/skills/omniskill"
